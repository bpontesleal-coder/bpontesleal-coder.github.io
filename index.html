<style>
:root {
  --font-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  --radius: 14px;
  --container: 1120px;
}

:root[data-theme="dark"] {
  --bg: #060C0B;
  --surface: #0D1816;
  --surface-2: #12211E;
  --line: rgba(94, 234, 212, 0.14);
  --line-strong: rgba(94, 234, 212, 0.32);
  --ink: #E4F1EE;
  --muted: #8EA6A0;
  --accent: #2DD4BF;
  --accent-ink: #04201C;
  --accent-soft: rgba(45, 212, 191, 0.12);
  --spark: #F5B44A;
  --spark-soft: rgba(245, 180, 74, 0.14);
  --glow: rgba(45, 212, 191, 0.35);
  --grid: rgba(94, 234, 212, 0.05);
  --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
}

:root[data-theme="light"] {
  --bg: #F4F6F4;
  --surface: #FFFFFF;
  --surface-2: #E9EEEB;
  --line: #D5DDD9;
  --line-strong: #A9BBB4;
  --ink: #13201D;
  --muted: #56655F;
  --accent: #0D6B61;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7ECE8;
  --spark: #B86E0C;
  --spark-soft: #F7E7CC;
  --glow: rgba(13, 107, 97, 0.22);
  --grid: rgba(19, 32, 29, 0.045);
  --shadow: 0 16px 40px rgba(19, 32, 29, 0.12);
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: 84px; }

body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  color: var(--ink);
  background-color: var(--bg);
  background-image:
    radial-gradient(900px 500px at 75% -10%, var(--accent-soft), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: auto, 48px 48px, 48px 48px;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.15; }
p { margin: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.container { max-width: var(--container); margin: 0 auto; padding: 0 20px; }

.skip { position: absolute; left: 16px; top: -60px; padding: 10px 16px; background: var(--accent); color: var(--accent-ink); border-radius: 8px; z-index: 200; }
.skip:focus { top: 12px; }

.mono { font-family: var(--font-mono); }
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent);
}
.eyebrow::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--glow); }
.eyebrow::after { content: ''; width: 56px; height: 1px; background: var(--line-strong); }

/* Barra de progresso de leitura */
.progress { position: fixed; top: 0; left: 0; height: 2px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: var(--accent); box-shadow: 0 0 10px var(--glow); z-index: 120; }

/* Cabeçalho */
.header { position: sticky; top: 0; z-index: 100; padding: 12px 0; }
.header__bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 8px 10px 8px 14px;
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line); border-radius: 999px;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 600; }
.brand__mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-strong); font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.nav { display: flex; gap: 4px; }
.nav a { padding: 7px 12px; border-radius: 999px; font-size: 14px; color: var(--muted); text-decoration: none; transition: color .2s, background .2s; }
.nav a:hover { color: var(--ink); }
.nav a.is-active { color: var(--ink); background: var(--accent-soft); }
.tools { display: flex; gap: 6px; }
.icon-btn { display: grid; place-items: center; min-width: 38px; height: 38px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.icon-btn:hover { border-color: var(--line-strong); }
.icon-btn svg { width: 17px; height: 17px; }
.menu-btn { display: none; }

/* Botões */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line-strong); background: transparent; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; transition: transform .15s, box-shadow .2s, background .2s; }
.btn svg { width: 17px; height: 17px; }
.btn:hover { transform: translateY(-1px); }
.btn--primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 24px var(--glow); }
.btn--small { padding: 9px 14px; font-size: 14px; }

/* Hero */
.hero { padding: 56px 0 72px; }
.hero__grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 56px; align-items: center; }
.status { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; color: var(--muted); background: var(--surface); }
.status__dot { width: 8px; height: 8px; border-radius: 50%; background: #34D399; box-shadow: 0 0 0 0 rgba(52, 211, 153, .6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }
.hero h1 { margin: 22px 0 10px; font-size: clamp(44px, 7vw, 82px); font-weight: 800; letter-spacing: -0.03em; }
.hero h1 span { display: block; color: var(--accent); text-shadow: 0 0 40px var(--glow); }
.typed { min-height: 1.6em; font-family: var(--font-mono); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.typed__cursor { display: inline-block; width: 9px; height: 1.1em; margin-left: 3px; vertical-align: -3px; background: var(--accent); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.hero__lede { max-width: 560px; margin: 18px 0 30px; font-size: 18px; color: var(--muted); }
.hero__actions { display: flex; flex-wrap: wrap; gap: 12px; }

.portrait { position: relative; justify-self: center; width: min(380px, 100%); }
.portrait::before { content: ''; position: absolute; inset: -18px; border-radius: 50%; border: 1px dashed var(--line-strong); }
/* Só o anel colorido gira; ele fica recortado no círculo para não alargar a página */
.portrait__frame { position: relative; aspect-ratio: 1; border-radius: 50%; padding: 10px; overflow: hidden; box-shadow: 0 0 60px var(--glow); }
.portrait__frame::before {
  content: ''; position: absolute; inset: 0;
  background: conic-gradient(from 0deg, var(--accent), transparent 30%, var(--accent) 50%, transparent 80%, var(--accent));
  animation: spin 14s linear infinite;
}
.portrait__img { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 6px solid var(--bg); }
@keyframes spin { to { transform: rotate(360deg); } }
.portrait__chip {
  position: absolute; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line-strong);
  background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(8px);
  font-size: 13px; box-shadow: var(--shadow); white-space: nowrap;
}
.portrait__chip b { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.portrait__chip--a { left: -18px; bottom: 16%; }
.portrait__chip--b { right: -12px; top: 12%; }

/* Números */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 56px; }
.stat { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.stat__value { font-family: var(--font-display); font-size: 34px; font-weight: 700; color: var(--accent); }
.stat__label { font-size: 14px; color: var(--muted); }

/* Seções */
.section { padding: 88px 0; }
.section__head { max-width: 720px; margin-bottom: 40px; }
.section__head h2 { margin: 14px 0 12px; font-size: clamp(32px, 4.5vw, 48px); letter-spacing: -0.02em; }
.section__head p { color: var(--muted); font-size: 17px; }

.panel { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

/* Cartões com luz que acompanha o cursor */
.spot { position: relative; overflow: hidden; }
.spot::before {
  content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .3s; pointer-events: none;
  background: radial-gradient(360px circle at var(--mx, 50%) var(--my, 50%), var(--accent-soft), transparent 60%);
}
.spot:hover::before { opacity: 1; }
.spot > * { position: relative; }

/* Sobre */
.about { display: grid; grid-template-columns: 1.2fr 1fr; gap: 32px; align-items: start; }
.about__text p + p { margin-top: 16px; }
.about__text { font-size: 17px; color: var(--muted); }
.about__text strong { color: var(--ink); font-weight: 600; }
.facts { display: grid; gap: 12px; margin-top: 28px; }
.fact { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 15px; }
.fact dt { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); padding-top: 2px; }
.fact dd { margin: 0; }

.gh { padding: 24px; }
.gh__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.gh__head h3 { font-size: 18px; }
.gh__bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); margin-bottom: 16px; }
.gh__bar span { height: 100%; transition: width 1s ease; width: 0; }
.gh__langs { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.gh__langs li { display: flex; align-items: center; gap: 10px; }
.gh__langs i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.gh__langs b { margin-left: auto; font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
.gh__nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
.gh__nums strong { display: block; font-family: var(--font-display); font-size: 26px; }
.gh__nums span { font-size: 12px; color: var(--muted); }
.gh__note { margin-top: 16px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Experiência */
.exp { display: grid; gap: 12px; }
.exp__item { padding: 0; }
.exp__btn { display: grid; grid-template-columns: 150px 1fr auto; gap: 20px; align-items: center; width: 100%; padding: 22px 24px; background: none; border: 0; text-align: left; cursor: pointer; }
.exp__when { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.exp__title { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.exp__org { font-size: 14px; color: var(--muted); }
.exp__icon { width: 22px; height: 22px; color: var(--accent); transition: transform .25s; }
.exp__item.is-open .exp__icon { transform: rotate(45deg); }
.exp__body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
.exp__item.is-open .exp__body { grid-template-rows: 1fr; }
.exp__inner { overflow: hidden; }
.exp__content { padding: 0 24px 24px calc(150px + 44px); color: var(--muted); }
.exp__content ul { margin: 12px 0 0; padding-left: 18px; }
.exp__content li + li { margin-top: 4px; }
.tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; background: var(--accent-soft); color: var(--accent); }
.tag--spark { background: var(--spark-soft); color: var(--spark); }

/* Filtros */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 14px; cursor: pointer; transition: background .2s, border-color .2s; }
.chip span { margin-left: 6px; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.chip.is-active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip.is-active span { color: inherit; opacity: .75; }

/* Projetos */
.projects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.project { display: flex; flex-direction: column; gap: 12px; padding: 24px; text-align: left; cursor: pointer; transition: border-color .2s, transform .2s; }
.project:hover { border-color: var(--line-strong); transform: translateY(-3px); }
.project--featured { grid-column: span 2; }
.project__top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.project__year { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.project h3 { font-size: 22px; }
.project p { color: var(--muted); font-size: 15px; }
.project__hl { font-size: 13px; font-weight: 600; color: var(--spark); }
.techs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 8px; }
.techs span { padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.project__more { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--accent); }
.project__more svg { width: 16px; height: 16px; transition: transform .2s; }
.project:hover .project__more svg { transform: translateX(3px); }

/* Linha de evolução */
.timeline { position: relative; display: grid; gap: 18px; padding-left: 44px; }
.timeline__track, .timeline__fill { position: absolute; left: 15px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; }
.timeline__track { background: var(--line); }
.timeline__fill { background: var(--accent); box-shadow: 0 0 12px var(--glow); transform-origin: top; transform: scaleY(0); }
.step { position: relative; padding: 20px 24px; }
.step::before { content: ''; position: absolute; left: -36px; top: 26px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--bg); transition: background .3s, border-color .3s, box-shadow .3s; }
.step.is-reached::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 14px var(--glow); }
.step__meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.step__meta b { color: var(--accent); font-weight: 500; }
.step h3 { margin: 8px 0 6px; font-size: 20px; }
.step p { color: var(--muted); font-size: 15px; }
.step--current { border-color: var(--line-strong); box-shadow: 0 0 0 1px var(--line-strong), 0 0 40px var(--accent-soft); }
.step--next { border-style: dashed; background: transparent; }

/* Habilidades */
.skills { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
.skills__tabs { display: grid; gap: 6px; align-content: start; padding: 8px; }
.skills__tab { display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 10px; border: 0; background: none; text-align: left; cursor: pointer; font-size: 15px; color: var(--muted); }
.skills__tab span { font-family: var(--font-mono); font-size: 12px; }
.skills__tab.is-active { background: var(--accent-soft); color: var(--ink); }
.skills__panel { padding: 28px; }
.skills__panel h3 { font-size: 22px; }
.skills__panel > p { margin: 6px 0 22px; color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 28px; margin: 0; padding: 0; list-style: none; }
.level__name { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
.level__name small { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.level__bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.level__bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); transition: width .8s cubic-bezier(.2, .8, .2, 1); }

/* Certificados */
.certs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.cert { display: flex; gap: 14px; padding: 18px; }
.cert__icon { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.cert__icon svg { width: 20px; height: 20px; }
.cert--award .cert__icon { background: var(--spark-soft); color: var(--spark); }
.cert h3 { font-family: var(--font-body); font-size: 15px; font-weight: 600; }
.cert p { font-size: 13px; color: var(--muted); }
.cert__year { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }

/* Contato */
.contact { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.contact__card { display: flex; flex-direction: column; gap: 6px; padding: 22px; text-decoration: none; }
.contact__card small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.contact__card strong { font-weight: 600; word-break: break-word; }
.contact__card span { margin-top: auto; padding-top: 10px; font-size: 13px; color: var(--muted); }
button.contact__card { text-align: left; border: 1px solid var(--line); cursor: pointer; }
a.contact__card:hover, button.contact__card:hover { border-color: var(--line-strong); }

.footer { padding: 40px 0; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
.footer .container { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

/* Revelar ao rolar */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity .6s ease, transform .6s ease; }
.reveal.is-visible { opacity: 1; transform: none; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 150; display: grid; place-items: center; padding: 20px; background: rgba(3, 8, 7, .7); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.modal.is-open { opacity: 1; pointer-events: auto; }
.modal__box { position: relative; width: min(640px, 100%); max-height: 88vh; overflow: auto; padding: 32px; border: 1px solid var(--line-strong); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); transform: translateY(12px); transition: transform .25s; }
.modal.is-open .modal__box { transform: none; }
.modal__box--wide { width: min(780px, 100%); }
.modal__close { position: absolute; top: 14px; right: 14px; }
.modal h3 { margin: 10px 0 8px; font-size: 26px; }
.modal h4 { margin: 22px 0 8px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.modal ul { margin: 0; padding-left: 18px; color: var(--muted); }
.modal__lead { color: var(--muted); }
.modal__links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }

.cv__meta { color: var(--muted); font-size: 14px; }
.cv__row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.cv__row span { color: var(--muted); text-align: right; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 160; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 14px; transform: translate(-50%, 80px); transition: transform .3s; }
.toast.is-visible { transform: translate(-50%, 0); }

@media (max-width: 960px) {
  .nav { display: none; }
  .menu-btn { display: grid; }
  .nav.is-open { display: grid; position: absolute; top: 68px; left: 20px; right: 20px; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
  .hero__grid, .about, .skills { grid-template-columns: 1fr; }
  .portrait { order: -1; width: min(280px, 80%); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .projects, .certs { grid-template-columns: repeat(2, 1fr); }

  let typingTimer = null;
  function startTyping() {
    clearTimeout(typingTimer);
    const el = document.getElementById('typed');
    const words = T[lang].typed;
    if (reducedMotion) { el.textContent = words[0]; return; }
    let word = 0, chars = 0, deleting = false;
    (function tick() {
      const current = words[word];
      chars += deleting ? -1 : 1;
      el.textContent = current.slice(0, chars);
      let delay = deleting ? 40 : 80;
      if (!deleting && chars === current.length) { deleting = true; delay = 1600; }
      else if (deleting && chars === 0) { deleting = false; word = (word + 1) % words.length; delay = 300; }
      typingTimer = setTimeout(tick, delay);
    })();
  }

  let revealObserver = null;
  function observeReveal() {
    if (revealObserver) revealObserver.disconnect();
    revealObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        entry.target.querySelectorAll('[data-count]').forEach(countUp);
        if (entry.target.classList.contains('stat')) countUp(entry.target.querySelector('[data-count]'));
        if (entry.target.classList.contains('skills')) fillLevels();
        revealObserver.unobserve(entry.target);
      });
    }, { threshold: 0.15 });
    document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
  }

  // Anima a parte numérica de valores como "8,61", "3+" e "1º", mantendo o restante do texto.
  function countUp(el) {
    if (!el || el.dataset.done) return;
    el.dataset.done = '1';
    const raw = el.dataset.count;
    const match = raw.match(/[\d.,]+/);
    if (!match || reducedMotion) return;
    const separator = match[0].includes(',') ? ',' : '.';
    const decimals = (match[0].split(/[.,]/)[1] || '').length;
    const target = parseFloat(match[0].replace(',', '.'));
    const start = performance.now();
    const duration = 1200;
    (function frame(now) {
      const progress = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const value = (target * eased).toFixed(decimals).replace('.', separator);
      el.textContent = raw.replace(match[0], value);
      if (progress < 1) requestAnimationFrame(frame);
    })(start);
  }

  function fillLevels() {
    document.querySelectorAll('.level__bar span').forEach(bar => {
      bar.style.width = (Number(bar.dataset.level) / 3 * 100) + '%';
    });

  let navObserver = null;
  function observeNav() {
    if (navObserver) navObserver.disconnect();
    const links = document.querySelectorAll('[data-nav]');
    navObserver = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        links.forEach(a => a.classList.toggle('is-active', a.dataset.nav === entry.target.id));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    T[lang].nav.forEach(([id]) => { const s = document.getElementById(id); if (s) navObserver.observe(s); });
  }

  function updateScroll() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    document.getElementById('progress').style.transform = `scaleX(${max > 0 ? window.scrollY / max : 0})`;

    const timeline = document.getElementById('timeline');
    if (!timeline) return;
    const rect = timeline.getBoundingClientRect();
    const reference = window.innerHeight * 0.6;
    const ratio = Math.max(0, Math.min(1, (reference - rect.top) / rect.height));
    document.getElementById('timelineFill').style.transform = `scaleY(${ratio})`;
    timeline.querySelectorAll('.step').forEach(step => {
      const top = step.getBoundingClientRect().top - rect.top + 26;
      step.classList.toggle('is-reached', top <= ratio * rect.height);
    });
  }

  /* GitHub: perfil, repositórios e linguagens, guardados por 1 hora para não esgotar o limite da API */
  async function loadGithub() {
    const cacheKey = 'bpl-github';
    try {
      const cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null');
      if (cached && Date.now() - cached.time < 3600000) return cached.data;
    } catch (e) { /* sem cache disponível */ }

    const api = path => fetch('https://api.github.com' + path).then(r => {
      if (!r.ok) throw new Error('GitHub ' + r.status);
      return r.json();
    });
    const [user, repos] = await Promise.all([api('/users/' + GITHUB_USER), api('/users/' + GITHUB_USER + '/repos?per_page=100')]);
    const own = repos.filter(r => !r.fork);
    const languages = await Promise.all(own.map(r => api(`/repos/${GITHUB_USER}/${r.name}/languages`)));
    const totals = {};
    languages.forEach(l => Object.entries(l).forEach(([name, bytes]) => { totals[name] = (totals[name] || 0) + bytes; }));
    const updated = own.map(r => r.pushed_at).sort().pop();
    const data = { repos: user.public_repos, followers: user.followers, updated, totals };
    try { sessionStorage.setItem(cacheKey, JSON.stringify({ time: Date.now(), data })); } catch (e) { /* segue sem cache */ }
    return data;
  }

  let githubData = null;
  async function renderGithub() {
    const t = T[lang];
    const body = document.getElementById('ghBody');
    try {
      githubData = githubData || await loadGithub();
    } catch (e) {
      body.innerHTML = `<p class="gh__note">${t.ghError}</p>`;
      return;
    }
    const total = Object.values(githubData.totals).reduce((a, b) => a + b, 0) || 1;
    const langs = Object.entries(githubData.totals).sort((a, b) => b[1] - a[1]).slice(0, 5)
      .map(([name, bytes]) => ({ name, pct: bytes / total * 100, color: LANG_COLORS[name] || '#8EA6A0' }));
    const date = githubData.updated ? new Date(githubData.updated).toLocaleDateString(lang === 'pt' ? 'pt-BR' : 'en-US', { day: '2-digit', month: 'short' }) : '–';
    body.innerHTML = `
      <div class="gh__bar">${langs.map(l => `<span data-width="${l.pct}" style="background:${l.color}" title="${esc(l.name)}"></span>`).join('')}</div>
      <ul class="gh__langs">${langs.map(l => `<li><i style="background:${l.color}"></i>${esc(l.name)}<b>${l.pct.toFixed(1).replace('.', lang === 'pt' ? ',' : '.')}%</b></li>`).join('')}</ul>
      <div class="gh__nums">
        <div><strong>${githubData.repos}</strong><span>${t.ghRepos}</span></div>
        <div><strong>${githubData.followers}</strong><span>${t.ghFollowers}</span></div>
        <div><strong>${date}</strong><span>${t.ghUpdated}</span></div>
      </div>
      <p class="gh__note">${t.ghNote}</p>`;
    requestAnimationFrame(() => body.querySelectorAll('[data-width]').forEach(s => { s.style.width = s.dataset.width + '%'; }));
  }

  /* Modal */
  const modal = document.getElementById('modal');
  const modalBox = document.getElementById('modalBox');

  function openModal(html, wide) {
    lastFocus = document.activeElement;
    modalBox.className = 'modal__box' + (wide ? ' modal__box--wide' : '');
    modalBox.innerHTML = `<button class="icon-btn modal__close" type="button" data-action="close" aria-label="${T[lang].close}">${ICON.close}</button>` + html;
    modal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    modalBox.querySelector('.modal__close').focus();
  }

  function closeModal() {
    modal.classList.remove('is-open');
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }

  function projectModal(id) {
    const t = T[lang];
    const p = PROJ.find(x => x.id === id);
    openModal(`
      <span class="tag">${L(PROJ_CATS[p.cat])} · ${p.year}</span>
      <h3 id="modalTitle">${L(p.title)}</h3>
      <p class="modal__lead">${L(p.short)}</p>
      <h4>${t.role2}</h4>
      <ul>${L(p.what).map(x => `<li>${x}</li>`).join('')}</ul>
      <h4>${t.stack}</h4>
      <div class="techs">${p.tech.map(x => `<span>${x}</span>`).join('')}</div>
      ${p.links.length ? `<div class="modal__links">${p.links.map(([label, href]) => `<a class="btn btn--primary btn--small" href="${href}" target="_blank" rel="noopener">${label} ${ICON.ext}</a>`).join('')}</div>` : ''}`);
  }

  function cvModal() {
    const t = T[lang];
    openModal(`
      <span class="tag">${t.cvTitle}</span>
      <h3 id="modalTitle">Bruna Pontes Leal</h3>
      <p class="cv__meta">${t.role} · ${t.loc} · ${LINKS.email} · linkedin.com/in/bruna-pontes-leal</p>
      <h4>${t.factObjective}</h4><p>${t.objective}</p>
      <h4>${t.factEdu}</h4><p>${t.edu} · CR 8,61</p>
      <h4>${t.cvExp}</h4>${EXP.map(e => `<div class="cv__row"><b>${L(e.title)}</b><span>${e.org} · ${L(e.when)}</span></div>`).join('')}
      <h4>${t.cvProj}</h4>${PROJ.map(p => `<div class="cv__row"><b>${L(p.title)}</b><span>${p.year}</span></div>`).join('')}
      <h4>${t.cvCerts}</h4>${CERTS.map(c => `<div class="cv__row"><b>${L(c.title)}</b><span>${L(c.org)} · ${c.year}</span></div>`).join('')}
      <h4>${t.cvSkills}</h4><p>${SKILLS.slice(0, 4).map(s => s.items.map(i => i[0]).join(', ')).join(' · ')}</p>
      <h4>${t.factLang}</h4><p>${t.langs}</p>
      <div class="modal__links"><button class="btn btn--primary btn--small" type="button" data-action="print">${ICON.print} ${t.cvPrint}</button></div>`, true);
  }

  /* Tema */
  function currentTheme() {
    return document.documentElement.dataset.theme;
  }
  function updateThemeBtn() {
    const btn = document.getElementById('themeBtn');
    const dark = currentTheme() === 'dark';
    btn.innerHTML = dark ? ICON.sun : ICON.moon;
    btn.setAttribute('aria-label', dark ? T[lang].themeLight : T[lang].themeDark);
  }
  const storedTheme = readStored('bpl-theme');
  document.documentElement.dataset.theme = storedTheme === 'light' || storedTheme === 'dark'
    ? storedTheme
    : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');

  function toast(message) {
    const el = document.getElementById('toast');
    el.textContent = message;
    el.classList.add('is-visible');
    setTimeout(() => el.classList.remove('is-visible'), 2200);
  }

  async function copyEmail() {
    try {
      await navigator.clipboard.writeText(LINKS.email);
      toast(T[lang].copied);
    } catch (e) {
      window.location.href = 'mailto:' + LINKS.email;
    }
  }

  /* Eventos */
  document.addEventListener('click', event => {
    const target = event.target.closest('button, a');
    if (!target) {
      if (event.target === modal) closeModal();
      return;
    }
    const { action, exp, project, filter, key, skill } = target.dataset;

    if (action === 'cv') cvModal();
    else if (action === 'close') closeModal();
    else if (action === 'print') window.print();
    else if (action === 'copy') copyEmail();
    else if (project) projectModal(project);
    else if (exp !== undefined) {
      const i = Number(exp);
      openExp.has(i) ? openExp.delete(i) : openExp.add(i);
      const item = target.closest('.exp__item');
      item.classList.toggle('is-open', openExp.has(i));
      target.setAttribute('aria-expanded', openExp.has(i));
    } else if (filter === 'proj') { projFilter = key; rerender(); }
    else if (filter === 'cert') { certFilter = key; rerender(); }
    else if (skill) { skillTab = skill; rerender(); }
    else if (target.id === 'langBtn') { lang = lang === 'pt' ? 'en' : 'pt'; store('bpl-lang', lang); rerender(); }
    else if (target.id === 'themeBtn') {
      const next = currentTheme() === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      store('bpl-theme', next);
      updateThemeBtn();
    } else if (target.id === 'menuBtn') {
      const nav = document.getElementById('nav');
      const open = nav.classList.toggle('is-open');
      target.setAttribute('aria-expanded', open);
    } else if (target.dataset.nav) {
      document.getElementById('nav').classList.remove('is-open');
      document.getElementById('menuBtn').setAttribute('aria-expanded', 'false');
    }
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && modal.classList.contains('is-open')) closeModal();
  });

  // Luz que acompanha o cursor nos cartões
  document.addEventListener('pointermove', event => {
    const card = event.target.closest('.spot');
    if (!card) return;
    const rect = card.getBoundingClientRect();
    card.style.setProperty('--mx', (event.clientX - rect.left) + 'px');
    card.style.setProperty('--my', (event.clientY - rect.top) + 'px');
  });

  let scrollPending = false;
  window.addEventListener('scroll', () => {
    if (scrollPending) return;
    scrollPending = true;
    requestAnimationFrame(() => { updateScroll(); scrollPending = false; });
  }, { passive: true });
  window.addEventListener('resize', updateScroll);

  render();

  // O conteúdo é criado por JavaScript, então o navegador não encontra a âncora (#secao) sozinho no carregamento.
  if (location.hash) {
    const section = document.getElementById(location.hash.slice(1));
    if (section) section.scrollIntoView();
  }
})();
</script>
</body>
</html>
