<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bruna Pontes Leal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: coluna única de leitura (max 1120px), seções separadas por respiro; cartões só onde o item é um objeto clicável */
:root {
  --bg: #F4F6F4;
  --surface: #FFFFFF;
  --surface-2: #E9EEEB;
  --ink: #13201D;
  --muted: #56655F;
  --line: #D5DDD9;
  --accent: #0D6B61;      /* verde-petróleo da serra */
  --accent-ink: #FFFFFF;
  --accent-soft: #D7ECE8;
  --spark: #C97A12;       /* âmbar: energia, destaques */
  --spark-soft: #F7E7CC;
  --code-bg: #12201D;
  --code-ink: #D9E7E3;
  --shadow: 0 1px 2px rgba(19,32,29,.06), 0 8px 24px rgba(19,32,29,.07);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --radius: 14px;
  --header-bg: rgba(244,246,244,.82);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1614; --surface: #15201D; --surface-2: #1C2A26; --ink: #E5EEEB; --muted: #97A8A2;
    --line: #26352F; --accent: #4CC1B1; --accent-ink: #0B1513; --accent-soft: #173A35;
    --spark: #F0B455; --spark-soft: #3A2D16; --code-bg: #0A1110; --code-ink: #D9E7E3;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); --header-bg: rgba(14,22,20,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1614; --surface: #15201D; --surface-2: #1C2A26; --ink: #E5EEEB; --muted: #97A8A2;
  --line: #26352F; --accent: #4CC1B1; --accent-ink: #0B1513; --accent-soft: #173A35;
  --spark: #F0B455; --spark-soft: #3A2D16; --code-bg: #0A1110; --code-ink: #D9E7E3;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35); --header-bg: rgba(14,22,20,.8);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 84px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap {
  width: 100%; max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* Header */
.header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--header-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.header .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 14px; letter-spacing: .02em; }
.nav { display: flex; gap: 4px; margin-left: auto; }
.nav a { text-decoration: none; color: var(--muted); font-size: 14.5px; font-weight: 500; padding: 6px 10px; border-radius: 8px; transition: color .15s, background .15s; }
.nav a:hover, .nav a.active { color: var(--ink); background: var(--surface-2); }
.tools { display: flex; gap: 6px; }
.icon-btn { height: 36px; min-width: 36px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600; font-family: var(--font-mono); }
.icon-btn:hover { border-color: var(--accent); }
.icon-btn svg { width: 17px; height: 17px; }
.menu-btn { display: none; }
@media (max-width: 900px) {
  .nav { display: none; position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; background: var(--surface); border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-left, 0px)) 14px; box-shadow: var(--shadow); }
  .nav.open { display: flex; }
  .nav a { padding: 10px 12px; font-size: 16px; }
  .tools { margin-left: auto; }
  .menu-btn { display: inline-flex; }
}

/* Hero */
.hero { padding-block: 56px 40px; }
.hero-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; align-items: center; }
@media (max-width: 900px) { .hero-grid { grid-template-columns: 1fr; gap: 32px; } .hero { padding-block: 32px 24px; } }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 500; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 6px 12px 6px 10px; border-radius: 999px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #2FA36B; box-shadow: 0 0 0 4px color-mix(in srgb, #2FA36B 22%, transparent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 6.4vw, 72px); line-height: 1.02; letter-spacing: -.025em; margin: 18px 0 10px; text-wrap: balance; }
.role { font-family: var(--font-display); font-weight: 500; font-size: clamp(19px, 2.2vw, 24px); color: var(--accent); margin: 0 0 16px; }
.lede { color: var(--muted); font-size: 17.5px; max-width: 34em; margin: 0 0 26px; }
.cta { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; border: 1px solid transparent; transition: transform .15s, background .15s, border-color .15s; }
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--accent); }
.btn svg { width: 17px; height: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.chip { font-family: var(--font-mono); font-size: 12.5px; padding: 4px 10px; border-radius: 8px; background: var(--surface-2); color: var(--ink); }

/* Code card */
.code-card { background: var(--code-bg); color: var(--code-ink); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.code-top { display: flex; align-items: center; gap: 7px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,.07); font-family: var(--font-mono); font-size: 12px; color: #8FA6A0; }
.code-top i { width: 11px; height: 11px; border-radius: 50%; background: #3A4B47; display: inline-block; }
.code-top span { margin-left: 8px; }
.code-card pre { margin: 0; padding: 20px 20px 22px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.75; overflow-x: auto; }
.k { color: #E9A653; } .t { color: #7FD3C6; } .s { color: #B8D98A; } .n { color: #F0C27A; } .c { color: #6E837E; font-style: italic; } .f { color: #9CC3F2; }
.caret { display: inline-block; width: 8px; height: 1.1em; background: #7FD3C6; vertical-align: -3px; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 44px; }
@media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.stat b { display: block; font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13.5px; color: var(--muted); line-height: 1.35; display: block; margin-top: 4px; }

/* Sections */
section.block { padding-block: 64px; }
@media (max-width: 720px) { section.block { padding-block: 44px; } }
.sec-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--spark); margin: 0 0 6px; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.sec-sub { color: var(--muted); max-width: 40em; margin: 10px 0 0; }
.divider { height: 1px; background: var(--line); }

/* About */
.about-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 40px; }
@media (max-width: 860px) { .about-grid { grid-template-columns: 1fr; gap: 28px; } }
.about-text p { margin: 0 0 16px; font-size: 17px; max-width: 38em; }
.about-text p:first-child { font-size: 19px; color: var(--ink); }
.facts { display: grid; gap: 14px; align-content: start; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }
.fact h3 { font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; font-weight: 500; }
.fact p { margin: 0; }
.lang-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px dashed var(--line); }
.lang-row:first-of-type { border-top: 0; }
.lang-row span:last-child { color: var(--muted); font-size: 14px; text-align: right; }

/* Timeline */
.timeline { position: relative; display: grid; gap: 14px; }
.tl-item { display: grid; grid-template-columns: 150px 1fr; gap: 24px; }
@media (max-width: 720px) { .tl-item { grid-template-columns: 1fr; gap: 6px; } }
.tl-when { font-family: var(--font-mono); font-size: 13px; color: var(--muted); padding-top: 20px; font-variant-numeric: tabular-nums; }
.tl-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; min-width: 0; }
.tl-head { width: 100%; text-align: left; background: none; border: 0; padding: 18px 20px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: start; }
.tl-head h3 { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 0; line-height: 1.25; }
.tl-org { color: var(--muted); font-size: 15px; grid-column: 1; }
.tl-tag { grid-column: 1; justify-self: start; margin-top: 8px; }
.tl-toggle { grid-row: 1 / span 3; grid-column: 2; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); display: grid; place-items: center; transition: transform .2s, background .2s; }
.tl-toggle svg { width: 16px; height: 16px; }
.tl-card.open .tl-toggle { transform: rotate(45deg); background: var(--accent-soft); border-color: transparent; }
.tl-body { padding: 0 20px 20px; }
.tl-body p { margin: 0 0 10px; color: var(--muted); }
.tl-body ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.tl-body li::marker { color: var(--accent); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.tag.amber { background: var(--spark-soft); color: var(--spark); }

/* Filters */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filter { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; color: var(--muted); }
.filter:hover { color: var(--ink); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filter .count { font-family: var(--font-mono); font-size: 12px; opacity: .7; margin-left: 4px; }

/* Projects */
.projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
@media (max-width: 400px) { .projects { grid-template-columns: 1fr; } }
.proj { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; cursor: pointer; display: flex; flex-direction: column; gap: 10px; transition: transform .18s, border-color .18s, box-shadow .18s; min-width: 0; }
.proj:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: var(--shadow); }
.proj-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.proj-year { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.proj h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin: 4px 0 0; line-height: 1.2; }
.proj p { margin: 0; color: var(--muted); font-size: 15px; }
.proj .highlight { font-size: 13.5px; font-weight: 600; color: var(--spark); }
.proj .chips { margin-top: auto; padding-top: 6px; }
.proj-more { font-size: 14px; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; }
.proj-more svg { width: 15px; height: 15px; transition: transform .15s; }
.proj:hover .proj-more svg { transform: translateX(3px); }

/* Certificates */
.certs { display: grid; gap: 28px; }
.year-group { display: grid; grid-template-columns: 90px 1fr; gap: 20px; }
@media (max-width: 640px) { .year-group { grid-template-columns: 1fr; gap: 8px; } }
.year { font-family: var(--font-display); font-weight: 800; font-size: 28px; color: var(--line); line-height: 1; padding-top: 14px; }
@media (max-width: 640px) { .year { color: var(--muted); font-size: 22px; } }
.cert-list { display: grid; gap: 10px; }
.cert { display: grid; grid-template-columns: 42px 1fr auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; min-width: 0; }
.cert-icon { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.cert-icon.amber { background: var(--spark-soft); color: var(--spark); }
.cert-icon svg { width: 20px; height: 20px; }
.cert h3 { font-size: 16px; font-weight: 600; margin: 0; line-height: 1.3; }
.cert p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
@media (max-width: 520px) { .cert { grid-template-columns: 42px 1fr; } .cert .tag { grid-column: 2; justify-self: start; } }

/* Skills */
.skills { display: grid; grid-template-columns: 260px 1fr; gap: 24px; }
@media (max-width: 760px) { .skills { grid-template-columns: 1fr; } }
.skill-tabs { display: grid; gap: 6px; align-content: start; }
@media (max-width: 760px) { .skill-tabs { display: flex; overflow-x: auto; padding-bottom: 4px; } }
.skill-tab { text-align: left; border: 1px solid transparent; background: none; padding: 12px 14px; border-radius: 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.skill-tab:hover { color: var(--ink); background: var(--surface-2); }
.skill-tab[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink); box-shadow: var(--shadow); }
.skill-tab small { font-family: var(--font-mono); font-weight: 400; color: var(--muted); }
.skill-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; min-width: 0; }
.skill-panel h3 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
.skill-panel > p { margin: 0 0 18px; color: var(--muted); }
.skill-items { display: flex; flex-wrap: wrap; gap: 10px; }
.skill-item { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 15px; font-weight: 500; display: inline-flex; gap: 8px; align-items: center; }
.skill-item small { font-size: 12px; color: var(--muted); font-weight: 400; }
.lvl { display: inline-flex; gap: 3px; }
.lvl i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.lvl i.on { background: var(--accent); }
.legend { margin-top: 18px; font-size: 13px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }

/* Contact */
.contact { background: var(--code-bg); color: var(--code-ink); border-radius: 22px; padding: 40px; display: grid; grid-template-columns: 1fr 1.1fr; gap: 32px; }
@media (max-width: 820px) { .contact { grid-template-columns: 1fr; padding: 28px 22px; } }
.contact h2 { color: #F1F6F4; }
.contact .eyebrow { color: #F0B455; }
.contact p { color: #A9BCB6; margin: 12px 0 0; max-width: 30em; }
.contact-list { display: grid; gap: 10px; }
.contact-item { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); min-width: 0; }
.contact-item small { display: block; font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #7F9690; }
.contact-item span, .contact-item a { color: #EAF2EF; font-weight: 500; overflow-wrap: anywhere; text-decoration: none; }
.contact-item a:hover { text-decoration: underline; }
.mini-btn { border: 1px solid rgba(255,255,255,.18); background: transparent; color: #EAF2EF; border-radius: 9px; padding: 6px 10px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.mini-btn:hover { border-color: #7FD3C6; }

footer { padding-block: 32px 40px; color: var(--muted); font-size: 14px; }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-backdrop { position: absolute; inset: 0; background: rgba(8,14,12,.55); backdrop-filter: blur(3px); animation: fade .2s; }
.modal-box { position: relative; width: 100%; max-width: 640px; max-height: 100%; overflow-y: auto; background: var(--surface); border-radius: 20px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: rise .22s ease-out; }
.modal-box.wide { max-width: 820px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.modal-close { position: absolute; top: 14px; right: 14px; }
.modal-box h3 { font-family: var(--font-display); font-size: 28px; margin: 6px 40px 8px 0; line-height: 1.15; }
.modal-box h4 { font-family: var(--font-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; font-weight: 500; }
.modal-box ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.modal-box li::marker { color: var(--accent); }
.modal-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }

/* Résumé view */
.cv h3 { margin-bottom: 2px; }
.cv-meta { color: var(--muted); font-size: 14.5px; }
.cv-sec { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 4px; }
.cv-row { margin: 10px 0; }
.cv-row b { display: block; }
.cv-row span { color: var(--muted); font-size: 14.5px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; z-index: 60; box-shadow: var(--shadow); }
</style>

</head>
<body>
<header class="header">
  <div class="wrap">
    <a class="brand" href="#inicio" aria-label="Início"><span class="brand-mark">BPL</span><span>Bruna Pontes Leal</span></a>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="tools">
      <button class="icon-btn" id="langBtn" type="button" aria-label="Mudar idioma">EN</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema"></button>
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app"></main>
<div id="modalRoot"></div>

<script>

            <div class="tl-when">${L(e.when)}</div>
            <div class="tl-card${openExp.has(i) ? ' open' : ''}">
              <button class="tl-head" type="button" data-exp="${i}" aria-expanded="${openExp.has(i)}" aria-controls="exp-${i}">
                <h3>${L(e.title)}</h3>
                <span class="tl-org">${e.org}</span>
                <span class="tag${e.amber ? ' amber' : ''} tl-tag">${L(e.tag)}</span>
                <span class="tl-toggle" aria-hidden="true">${ICON.plus}</span>
              </button>
              <div class="tl-body" id="exp-${i}" ${openExp.has(i) ? '' : 'hidden'}>
                <p>${L(e.desc)}</p>
                <ul>${L(e.items).map(x => `<li>${x}</li>`).join('')}</ul>
              </div>
            </div>
          </div>`).join('')}
        </div>
      </div></section>

      <section class="block" id="projetos"><div class="wrap">
        <div class="sec-head">
          <div><p class="eyebrow">${t.projEyebrow}</p><h2>${t.projTitle}</h2><p class="sec-sub">${t.projSub}</p></div>
          <div class="filters" role="group" aria-label="Filtrar projetos">
            ${filterBtn('proj', 'all', t.all, PROJ.length, projFilter)}
            ${Object.keys(PROJ_CATS).map(k => filterBtn('proj', k, L(PROJ_CATS[k]), PROJ.filter(p => p.cat === k).length, projFilter)).join('')}
          </div>
        </div>
        <div class="projects">${PROJ.filter(p => projFilter === 'all' || p.cat === projFilter).map(p => `
          <button class="proj" type="button" data-proj="${p.id}">
            <div class="proj-top"><span class="tag${p.cat === 'inovacao' ? ' amber' : ''}">${L(PROJ_CATS[p.cat])}</span><span class="proj-year">${p.year}</span></div>
            <h3>${L(p.title)}</h3>
            ${p.highlight ? `<span class="highlight">${L(p.highlight)}</span>` : ''}
            ${p.status ? `<span class="highlight">${L(p.status)}</span>` : ''}
            <p>${L(p.short)}</p>
            <div class="chips">${p.tech.map(c => `<span class="chip">${c}</span>`).join('')}</div>
            <span class="proj-more">${t.details} ${ICON.arrow}</span>
          </button>`).join('')}
        </div>
      </div></section>

      <section class="block" id="certificados"><div class="wrap">
        <div class="sec-head">
          <div><p class="eyebrow">${t.certEyebrow}</p><h2>${t.certTitle}</h2><p class="sec-sub">${t.certSub}</p></div>
          <div class="filters" role="group" aria-label="Filtrar certificados">
            ${filterBtn('cert', 'all', t.all, CERTS.length, certFilter)}
            ${Object.keys(CERT_TYPES).map(k => filterBtn('cert', k, L(CERT_TYPES[k]), CERTS.filter(c => c.type === k).length, certFilter)).join('')}
          </div>
        </div>
        <div class="certs">${certGroups()}</div>
      </div></section>

      <section class="block" id="habilidades"><div class="wrap">
        <div class="sec-head"><div><p class="eyebrow">${t.skillEyebrow}</p><h2>${t.skillTitle}</h2></div></div>
        <div class="skills">
          <div class="skill-tabs" role="tablist" aria-label="${t.skillTitle}">${SKILLS.map(s => `
            <button class="skill-tab" role="tab" type="button" id="tab-${s.id}" aria-controls="skill-panel" aria-selected="${s.id === skillTab}" data-skill="${s.id}">${L(s.name)} <small>${s.items.length}</small></button>`).join('')}
          </div>
          ${skillPanel()}
        </div>
      </div></section>

      <section class="block" id="contato"><div class="wrap">
        <div class="contact">
          <div><p class="eyebrow">${t.contactEyebrow}</p><h2>${t.contactTitle}</h2><p>${t.contactText}</p></div>
          <div class="contact-list">
            <div class="contact-item"><div><small>E-mail</small><span id="emailText">${LINKS.email}</span></div><button class="mini-btn" type="button" id="copyEmail">${t.copy}</button></div>
            <div class="contact-item"><div><small>LinkedIn</small><a href="${LINKS.linkedin}" target="_blank" rel="noopener">linkedin.com/in/bruna-pontes-leal</a></div><a class="mini-btn" href="${LINKS.linkedin}" target="_blank" rel="noopener">${t.open}</a></div>
            <div class="contact-item"><div><small>GitHub</small><a href="${LINKS.github}" target="_blank" rel="noopener">github.com/bpontesleal-coder</a></div><a class="mini-btn" href="${LINKS.github}" target="_blank" rel="noopener">${t.open}</a></div>
            <div class="contact-item"><div><small>${t.locLabel}</small><span>${t.loc}</span></div></div>
          </div>
        </div>
      </div></section>

      <footer><div class="wrap"><span>© 2026 Bruna Pontes Leal</span><span>${t.footer}</span></div></footer>`;
    updateThemeBtn();
    observeNav();
  }

  function filterBtn(group, key, label, count, current) {
    return `<button class="filter" type="button" data-filter-${group}="${key}" aria-pressed="${key === current}">${label}<span class="count">${count}</span></button>`;
  }

  function certGroups() {
    const list = CERTS.filter(c => certFilter === 'all' || c.type === certFilter);
    const years = [...new Set(list.map(c => c.year))].sort((a, b) => b - a);
    return years.map(y => `
      <div class="year-group"><div class="year">${y}</div><div class="cert-list">${list.filter(c => c.year === y).map(c => {
        const ty = CERT_TYPES[c.type]; const amber = c.type === 'award';
        return `<div class="cert"><div class="cert-icon${amber ? ' amber' : ''}">${ICON[ty.icon]}</div><div><h3>${L(c.title)}</h3><p>${L(c.org)}</p></div><span class="tag${amber ? ' amber' : ''}">${L(ty.one)}</span></div>`;
      }).join('')}</div></div>`).join('');
  }

  function skillPanel() {
    const s = SKILLS.find(x => x.id === skillTab); const t = T[lang];
    const dots = n => `<span class="lvl" aria-label="${t.legend[n - 1]}">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
    return `<div class="skill-panel" id="skill-panel" role="tabpanel" aria-labelledby="tab-${s.id}">
      <h3>${L(s.name)}</h3><p>${L(s.desc)}</p>
      <div class="skill-items">${s.items.map(([n, l]) => `<span class="skill-item">${n} ${dots(l)}</span>`).join('')}</div>
      <div class="legend">${t.legend.map((x, i) => `<span>${dots(i + 1)} ${x}</span>`).join('')}</div>
    </div>`;
  }

  /* ---------- Modais ---------- */
  let lastFocus = null;
  function openModal(html, wide) {
    lastFocus = document.activeElement;
    const root = document.getElementById('modalRoot');
    root.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="modal-backdrop" data-close></div>
      <div class="modal-box${wide ? ' wide' : ''}"><button class="icon-btn modal-close" type="button" data-close aria-label="Fechar">${ICON.close}</button>${html}</div></div>`;
    document.body.style.overflow = 'hidden';
    root.querySelector('.modal-close').focus();
  }
  function closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }
  function projectModal(id) {
    const p = PROJ.find(x => x.id === id); const t = T[lang];
    openModal(`
      <span class="tag${p.cat === 'inovacao' ? ' amber' : ''}">${L(PROJ_CATS[p.cat])} · ${p.year}</span>
      <h3>${L(p.title)}</h3>
      <p style="color:var(--muted);margin:0">${L(p.short)}</p>
      ${p.highlight ? `<h4>${t.result}</h4><p style="margin:0">${L(p.highlight)}</p>` : ''}
      <h4>${t.role2}</h4><ul>${L(p.what).map(x => `<li>${x}</li>`).join('')}</ul>
      <h4>${t.stack}</h4><div class="chips" style="margin:0">${p.tech.map(c => `<span class="chip">${c}</span>`).join('')}</div>
      ${p.links.length ? `<div class="modal-links">${p.links.map(([l, h]) => `<a class="btn btn-primary" href="${h}" target="_blank" rel="noopener">${l} ${ICON.ext}</a>`).join('')}</div>` : ''}`);
  }
  function cvModal() {
    const t = T[lang];
    openModal(`<div class="cv">
      <span class="tag">${t.cvTitle}</span>
      <h3>Bruna Pontes Leal</h3>
      <div class="cv-meta">${t.role} · ${t.loc} · ${LINKS.email}</div>
      <div class="cv-sec"><h4>${t.factObjective}</h4><p style="margin:0">${t.objective}</p></div>
      <div class="cv-sec"><h4>${t.factEdu}</h4><p style="margin:0">${t.edu} · CR 8,61</p></div>
      <div class="cv-sec"><h4>${t.expTitle}</h4>${EXP.map(e => `<div class="cv-row"><b>${L(e.title)}</b><span>${e.org} · ${L(e.when)}</span></div>`).join('')}</div>
      <div class="cv-sec"><h4>${t.projTitle}</h4>${PROJ.map(p => `<div class="cv-row"><b>${L(p.title)}</b><span>${p.year}${p.highlight ? ' · ' + L(p.highlight) : ''}</span></div>`).join('')}</div>
      <div class="cv-sec"><h4>${t.certTitle}</h4>${CERTS.map(c => `<div class="cv-row"><b>${L(c.title)}</b><span>${L(c.org)} · ${c.year}</span></div>`).join('')}</div>
      <div class="cv-sec"><h4>${t.skillTitle}</h4><p style="margin:0">${SKILLS.slice(0, 4).map(s => s.items.map(i => i[0]).join(', ')).join(' · ')}</p></div>
      <div class="cv-sec"><h4>${t.factLang}</h4><p style="margin:0">${t.langs.map(l => l.join(': ')).join(' · ')}</p></div>
    </div>`, true);
  }

  /* ---------- Tema ---------- */
  function currentTheme() {
    const a = document.documentElement.getAttribute('data-theme');
    if (a) return a;
    return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  function updateThemeBtn() {
    const b = document.getElementById('themeBtn'); const dark = currentTheme() === 'dark';
    b.innerHTML = dark ? ICON.sun : ICON.moon;
    b.setAttribute('aria-label', dark ? T[lang].themeLight : T[lang].themeDark);
  }
  try { const th = localStorage.getItem('bpl-theme'); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) {}

  /* ---------- Toast ---------- */
  function toast(msg) {
    const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
    document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
  }

  /* ---------- Nav ativa ---------- */
  let io;
  function observeNav() {
    if (io) io.disconnect();
    if (!('IntersectionObserver' in window)) return;
    io = new IntersectionObserver(entries => {
      entries.forEach(en => {
        if (en.isIntersecting) document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + en.target.id));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('section[id]').forEach(s => io.observe(s));
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', e => {
    const el = e.target.closest('button, a'); if (!el) return;
    if (el.hasAttribute('data-close')) return closeModal();
    if (el.id === 'langBtn') { lang = lang === 'pt' ? 'en' : 'pt'; try { localStorage.setItem('bpl-lang', lang); } catch (x) {} return render(); }
    if (el.id === 'themeBtn') { const n = currentTheme() === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); try { localStorage.setItem('bpl-theme', n); } catch (x) {} return updateThemeBtn(); }
    if (el.id === 'menuBtn') { const nav = document.getElementById('nav'); const o = nav.classList.toggle('open'); el.setAttribute('aria-expanded', o); return; }
    if (el.hasAttribute('data-nav')) { document.getElementById('nav').classList.remove('open'); document.getElementById('menuBtn').setAttribute('aria-expanded', 'false'); return; }
    if (el.id === 'cvBtn') return cvModal();
    if (el.id === 'copyEmail') {
      const done = () => toast(T[lang].copied);
      try {
        navigator.clipboard.writeText(LINKS.email).then(done, () => selectEmail());
      } catch (x) { selectEmail(); }
      return;
    }
    if (el.dataset.exp !== undefined) {
      const i = +el.dataset.exp; const card = el.parentElement; const body = card.querySelector('.tl-body');
      const open = !openExp.has(i); open ? openExp.add(i) : openExp.delete(i);
      card.classList.toggle('open', open); body.hidden = !open; el.setAttribute('aria-expanded', open); return;
    }
    if (el.dataset.proj) return projectModal(el.dataset.proj);
    if (el.dataset.filterProj) { projFilter = el.dataset.filterProj; return rerenderKeepScroll(); }
    if (el.dataset.filterCert) { certFilter = el.dataset.filterCert; return rerenderKeepScroll(); }
    if (el.dataset.skill) { skillTab = el.dataset.skill; return rerenderKeepScroll(); }
  });
  function selectEmail() {
    const n = document.getElementById('emailText'); const r = document.createRange(); r.selectNodeContents(n);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  function rerenderKeepScroll() {
    const y = scrollY; const active = document.activeElement; const key = active && (active.dataset.filterProj || active.dataset.filterCert || active.dataset.skill);
    render(); scrollTo(0, y);
    if (key) { const sel = active.dataset.filterProj ? `[data-filter-proj="${key}"]` : active.dataset.filterCert ? `[data-filter-cert="${key}"]` : `[data-skill="${key}"]`; const n = document.querySelector(sel); if (n) n.focus(); }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.modal')) closeModal(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', updateThemeBtn);

  render();
})();
</script>

</body>
</html>
